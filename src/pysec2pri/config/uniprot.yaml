# Datasource metadata
config_id: "uniprot"
datasource_id: "uniprot"
name: "UniProt"
parser_class: "UniProtParser"
products: ["subset", "species"]
prefix: "UniProtKB"
curie_base_url: "http://identifiers.org/uniprot/"
entity_types: ["proteins"]

# Reviewed (Swiss-Prot) vs unreviewed (TrEMBL) primary accessions.
# Note: the TrEMBL delac file is too large and probably not that relevant,
# so for now the package does not retrieve deletions for TrEMBL.
subset:
  default: all
  available:
    all: { label: "All (Swiss-Prot + TrEMBL primary ACs; deletions: Swiss-Prot only)" }
    swissprot: { label: "Reviewed (Swiss-Prot primary ACs only)" }
    trembl: { label: "Unreviewed (TrEMBL primary ACs only, no deletions)" }

# NCBI taxon ID, or "all" for --help text.
species:
  default: "all"
  note:
    "Reviewed (Swiss-Prot) primaries are resolved locally from acindex.txt/
    speclist.txt. Unreviewed (TrEMBL) primaries, when subset allows them,
