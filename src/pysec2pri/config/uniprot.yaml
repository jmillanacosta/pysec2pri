download_urls:
  sec_ac: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/docs/sec_ac.txt"
  delac_sp: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/docs/delac_sp.txt"
  acindex: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/docs/acindex.txt"
  speclist: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/docs/speclist.txt"
  # delac_tr: "https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/docs/delac_tr.txt.gz"

# TrEMBL has no lightweight per-accession species file (unlike acindex.txt
# for Swiss-Prot), so species filtering for it queries this REST endpoint
# instead, paginated. {taxon_id} is filled in at query time.
trembl_species_url: "https://rest.uniprot.org/uniprotkb/search"
trembl_species_query: "organism_id:{taxon_id} AND reviewed:false"

primary_file_key: "sec_ac"
archive_url: "https://ftp.uniprot.org/pub/databases/uniprot/previous_releases/"
version_iri: "https://ftp.uniprot.org/pub/databases/uniprot/previous_releases/release-{version}/"
id_pattern: "^[OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2}$"
default_output_filename: "uniprot_sec2pri.sssom.tsv"

mapping_sets:
  ids:
    consolidate: true
    method: parse
    # download_urls key -> parameter of `method`
    inputs:
      {
        sec_ac: input_path,
        delac_sp: delac_path,
        acindex: acindex_path,
        speclist: speclist_path,
      }
    formats: [sssom, sec2pri, pri_ids, secondary, rdf, json, owl, all]

  primary_ids:
    method: parse_primary_ids
    inputs: { acindex: acindex_path }
    formats: [pri_ids]
input_file_types:
  - sec_ac.txt
  - delac_sp.txt

source: "UniProt"
homepage: "https://www.uniprot.org/"

# Suggested cross-reference crosswalk source(s) for disambiguation context
# (see mapkgsutils.context.ContextSpec, kind="xref")
xref_sources:
  - id: hgnc_custom
    name: "HGNC custom download -- Ensembl/Entrez/RefSeq/UniProt/etc. crosswalk"
    url: "https://www.genenames.org/cgi-bin/download/custom?col=gd_hgnc_id&col=gd_app_sym&col=gd_app_name&col=gd_status&col=gd_prev_sym&col=gd_pub_refseq_ids&col=md_eg_id&col=md_ensembl_id&col=md_mim_id&col=md_vega_id&col=md_refseq_id&col=md_ucsc_id&col=md_prot_id&status=Approved&status=Entry%20Withdrawn&hgnc_dbtag=on&order_by=gd_app_sym_sort&format=text&submit=submit"
    format: tsv
    object_id_col: "HGNC ID"
    object_label_col: "Approved symbol"
    subject_id_cols:
      ensembl: "Ensembl ID(supplied by Ensembl)"
      entrez: "NCBI Gene ID(supplied by NCBI)"
      refseq: "RefSeq IDs"
      uniprot: "UniProt ID(supplied by UniProt)"
    note:
      "Source of truth for cross-references varies, you can supply
      your own XrefMapping."
